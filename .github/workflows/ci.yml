name: CI
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-and-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONPATH: frontend-pyside/src
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: frontend-pyside/requirements.txt
      - name: Audit public source
        run: python scripts/audit_public_source.py
      - name: Install Qt and test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libopengl0 libxkbcommon0
          # GUI tests use only QtBase/QtTest; avoid the unrelated 175 MB Addons wheel.
          QT_VERSION=$(python -c "from pathlib import Path; print(next(line.split('==')[1] for line in Path('frontend-pyside/requirements.txt').read_text().splitlines() if line.startswith('PySide6==')))")
          python -m pip install --only-binary=:all: "PySide6-Essentials==$QT_VERSION"
      - name: Python and shell syntax
        run: |
          python -m compileall -q frontend-pyside/src frontend-pyside/tests scripts
          for script in scripts/*.sh frontend-pyside/build_app.sh; do bash -n "$script"; done
      - name: Keyboard, focus and backend reuse tests
        run: python -X faulthandler -m unittest discover -s frontend-pyside/tests -v
      - name: SDK-independent C++ tests
        run: |
          cmake -S backend -B build-tests -DFX6_BUILD_SDK_BACKEND=OFF -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-tests --parallel 2
          ctest --test-dir build-tests --output-on-failure
